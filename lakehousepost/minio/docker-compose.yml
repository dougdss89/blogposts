version: '3'
services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"     # API
      - "9001:9001"     # Console
      
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin

    command: server --console-address ":9001" /data{1...4}
    
    volumes:
      - minio_data1:/data1
      - minio_data2:/data2
      - minio_data3:/data3
      - minio_data4:/data4
      - dockervol:/dockervol

    networks:
      - hadoopcluster

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

networks:
  hadoopcluster:
    external: true

volumes:
  minio_data1:
  minio_data2:
  minio_data3:
  minio_data4:

  dockervol:
    external: True
