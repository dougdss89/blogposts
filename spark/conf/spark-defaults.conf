# Configuração Básica do Spark
spark.master=spark://spark-master:7077
spark.eventLog.enabled=true
spark.eventLog.dir=/opt/spark/spark-events
spark.history.ui.port=18080
spark.history.fs.logDirectory=file:/opt/spark/spark-events

# SQL and Warehouse Configuration
hive.metastore.warehouse.dir=s3a://sparkdw/
spark.sql.warehouse.dir=s3a://sparkdw/
spark.sql.parquet.compression.codec=snappy
spark.sql.parquet.write.compression.codec=snappy
parquet.block.size=134217728
parquet.page.size=1048576
spark.sql.files.maxPartitionBytes=134217728
spark.sql.files.openCostInBytes=4194304
spark.sql.sources.partitionOverwriteMode=dynamic
spark.sql.files.maxRecordsPerFile=1000000
spark.sql.shuffle.partitions=200
spark.sql.hive.metastorePartitionPruning=true
spark.sql.parquet.filterPushdown=true
spark.sql.parquet.mergeSchema=false
spark.sql.autoBroadcastJoinThreshold=10485760
spark.sql.broadcastTimeout=300
spark.sql.execution.arrow.pyspark.enabled=true


# Memory and Executor Configuration
spark.executor.memory=8g
spark.driver.memory=4g
spark.executor.cores=4
spark.driver.cores=2
spark.executor.memoryOverhead=2g
spark.executor.instances=4
spark.driver.maxResultSize=6g

# Dynamic Allocation
spark.dynamicAllocation.enabled         true
spark.dynamicAllocation.minExecutors    2
spark.dynamicAllocation.maxExecutors    8
spark.dynamicAllocation.initialExecutors 4

# JVM Options
# Opções JVM
# Configuração única para driver e executor
spark.executor.extraJavaOptions=-XX:+UseG1GC -XX:+UseStringDeduplication -Dlog4j.configuration=file:/opt/spark/conf/log4j.properties
spark.driver.extraJavaOptions=-XX:+UseG1GC -XX:+UseStringDeduplication -Dlog4j.configuration=file:/opt/spark/conf/log4j.properties

# Shuffle Configuration
spark.shuffle.compress=true
spark.shuffle.spill.compress=true
spark.shuffle.file.buffer=32k
spark.shuffle.io.maxRetries=5
spark.shuffle.io.retryWait=5s

#minIO configuration
spark.hadoop.fs.defaultFS=s3a://sparkdw
spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint http://minio:9000
spark.hadoop.fs.s3a.access.key minioadmin
spark.hadoop.fs.s3a.secret.key minioadmin
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.connection.maximum 100
spark.hadoop.fs.s3a.connection.timeout 5000
spark.hadoop.fs.s3a.attempts.maximum 10
spark.hadoop.fs.s3a.paging.maximum 1000
spark.hadoop.fs.s3a.multipart.threshold 128m
spark.hadoop.fs.s3a.multipart.size 128m
spark.executor.extraJavaOptions=-Daws.java.v1.disableDeprecationAnnouncement=true
spark.driver.extraJavaOptions=-Daws.java.v1.disableDeprecationAnnouncement=true

#DELTA
spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.defaultCatalog=spark_catalog
spark.jars.packages=io.delta:delta-spark_2.13:jar:3.3.0,org.apache.parquet:parquet-hadoop-bundle:1.12.3,org.apache.hadoop:hadoop-aws:3.3.4,org.scala-lang:scala-library:2.13.8,com.microsoft.sqlserver:mssql-jdbc:jar:12.8.1.jre11,org.postgresql:postgresql:jar:42.6.0,org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.5.2,com.github.ben-manes.caffeine:caffeine:3.1.8





